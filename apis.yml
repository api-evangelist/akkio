apis:
- aid: akkio:akkio-datasets-api
  name: Akkio Datasets API
  description: >-
    Legacy v1 datasets surface. Create a dataset, append rows, set field types, parse fields, list and
    delete. Authenticated with an api_key query parameter on GET and an api_key JSON body field on POST/DELETE.
    Still the only programmatic way to create a dataset.
  humanURL: https://docs.akkio.com/akkio-docs/endpoints-and-schemas/endpoints/datasets
  baseURL: https://api.akkio.com/v1
  tags:
  - Datasets
  properties:
  - type: OpenAPI
    url: openapi/akkio-datasets-api-openapi.yml
  - type: Overlay
    url: overlays/akkio-legacy-v1-overlay.yaml
  - type: Authentication
    url: authentication/akkio-authentication.yml
  - type: Documentation
    url: https://docs.akkio.com/akkio-docs/endpoints-and-schemas/endpoints/datasets
- aid: akkio:akkio-models-api
  name: Akkio Models API
  description: >-
    Legacy v1 models surface. List trained models and POST rows to a model to receive predictions with
    per-class probabilities. Akkio's own docs describe the newer /api/v1 Training routes as a better-designed
    v2 of this route's training half.
  humanURL: https://docs.akkio.com/akkio-docs/endpoints-and-schemas/endpoints/models
  baseURL: https://api.akkio.com/v1
  tags:
  - Models
  - Predictions
  properties:
  - type: OpenAPI
    url: openapi/akkio-models-api-openapi.yml
  - type: Overlay
    url: overlays/akkio-legacy-v1-overlay.yaml
  - type: Authentication
