aid: akkio
name: Akkio
description: >-
  Akkio is a no-code predictive AI and AI-workflow-automation platform built for
  media agencies and data providers. Teams use it to activate data across the
  campaign lifecycle: audience segmentation, propensity modeling, RFM analysis,
  media-mix modeling, performance measurement, and campaign-strategy development,
  all from unified intelligence. Beyond the app, Akkio ships a developer REST API
  on https://api.akkio.com in two generations: the legacy /v1 datasets and models
  routes (api_key in query or body), and the current "Akkio Public API (Beta)" at
  /api/v1, which covers projects, asynchronous model training and Chat Explore
  natural-language querying behind an X-API-Key header. Akkio publishes its own
  OpenAPI 3.1.0 document at /api/v1/api.yaml with a Swagger UI at /api/v1/docs
  and documents generating clients from it; the two first-party SDKs (PyPI and
  npm `akkio`) cover only the legacy surface and have not been released since
  2021. The company is SOC 2 Type 2 and HIPAA compliant (verified via Drata).
url: https://raw.githubusercontent.com/api-evangelist/akkio/refs/heads/main/apis.yml
