note: >-
  Akkio does not implement RFC 9457 problem+json. Two distinct error envelopes
  coexist and an agent has to handle both. (1) The /api/v1 public beta API is
  FastAPI/Pydantic: the only error response either published spec DECLARES is
  422, carrying HTTPValidationError -> {"detail": [ValidationError]} where each
  ValidationError is {loc, msg, type}. (2) The legacy /v1 datasets/models API
  returns a flat vendor envelope with a "status" field ("success" on the happy
  path) and is documented with a 404 case. 401 and 403 are documented in prose
  on the authentication page but are declared in NEITHER spec, so a generated
  client will not model them. No error CODE registry, no type URIs, no
  remediation catalog is published.
