  detail: >-
    Two generations run concurrently. The legacy /v1 datasets+models surface is
    the one the 2021-era first-party SDKs wrap; Akkio's own Training docs call
    the newer /api/v1 routes "a better-designed v2 of our legacy /v1/models
    route". The newer surface carries info.version 0.1.0 and is explicitly
    labelled beta.
