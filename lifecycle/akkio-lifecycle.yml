  status: beta
  evidence: >-
    'The Akkio API is currently in beta.' — https://docs.akkio.com/akkio-docs/rest-api/api-introduction
    Spec title is "Akkio Public API (Beta)". Several platform capabilities are
    separately marked beta in the docs (HubSpot (Beta), PostgreSQL (Beta)).
  feedback_channel: support@akkio.com, or the chat bubble on https://app.akkio.com/
deprecation:
  policy_url: null
  sunset_header: false
  detail: >-
    No deprecation policy, no RFC 8594 Sunset/Deprecation header support, and no
    stated timeline for the legacy /v1 surface even though Akkio's own docs
    describe it as superseded. Queried the docs directly (GitBook ?ask=) on
    2026-08-13; the docs' own answer was that no changelog, release notes or
    formal deprecation policy exists and directs users to support@akkio.com for
    upcoming-change confirmation.
