sdk_currency:
  detail: >-
    Both first-party SDKs (PyPI `akkio`, npm `akkio`) last published 1.0.5 on
    2021-03-05 — over five years stale as of this pass — and they wrap only the
    legacy /v1 datasets+models surface. Neither covers the current /api/v1
    projects, training or chat-explore routes. Akkio's answer to this is code
    generation off the published spec rather than SDK maintenance; the docs'
    Code Generation page recommends generating a client from
    https://api.akkio.com/api/v1/api.yaml. See packages/akkio-packages.yml.
