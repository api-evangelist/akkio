agent_note: >-
  Every /api/v1 tool above is asynchronous submit-poll-fetch, and a FAILED job
  returns HTTP 200 with status FAILED in the body. Any MCP server built over this
  API must surface the task lifecycle rather than pretending the call is
  synchronous. See conventions/akkio-conventions.yml.
