note: >-
  No official hosted or local MCP server exists for Akkio. Probed 2026-08-13:
  POST tools/list against https://api.akkio.com/mcp returned 403 "Unauthorized."
  (the API gateway's generic deny for unknown routes, not an OAuth challenge),
  https://akkio.com/mcp returned 405, mcp.akkio.com and mcp.akk.io do not
  resolve, and https://app.akkio.com/mcp returned the SPA catch-all HTML shell.
  No MCP package is published by akkio-inc on npm or PyPI and Akkio does not
  appear in the public MCP registries. The tool list below is a CANDIDATE derived
  one-to-one from operations that genuinely exist in the two OpenAPI documents
  Akkio serves live; it is a proposal, not a surface Akkio ships. No endpoint is
  invented.
