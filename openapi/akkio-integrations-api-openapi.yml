      operationId: _controller_handle_introspect_table_integrations_introspect_table_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntrospectTablePayload'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /integrations/commit/import:
    post:
      tags:
      - Integrations
      summary: ' Controller Handle Commit Import'
      description: Performs an ad-hoc import and persists anything needed for dataset refreshes to trigger. We return the dataset_id, which the frontend uses to direct the user to the proper place.
      operationId: _controller_handle_commit_import_integrations_commit_import_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitImportPayload'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
                title: Response  Controller Handle Commit Import Integrations Commit Import Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /integrations/preview/predict:
    post:
      tags:
      - Integrations
      summary: ' Controller Handle Preview Predict'
      description: Represents a user providing connection details and a table of interest, and us giving them a preview of what the data transform looks like. The user is expected to follow this up with a "Predict Commit" request representing a user asking for an ad-hoc import and persistent prediction schedule.
      operationId: _controller_handle_preview_predict_integrations_preview_predict_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewPredictPayload'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewPredictResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /integrations/commit/predict:
    post:
      tags:
      - Integrations
      summary: ' Controller Handle Commit Predict'
      description: Represents a user formally submitting an ad-hoc import and persistent prediction schedule.
      operationId: _controller_handle_commit_predict_integrations_commit_predict_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitPredictPayload'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
