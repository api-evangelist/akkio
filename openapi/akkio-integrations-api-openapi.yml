      - name
      - label
      - hubspot_defined
      - hidden
      title: HubSpotPropertyInfo
    PreviewPredictResponse:
      properties:
        dataset_id:
          type: string
          title: Dataset Id
          description: Dataset created during the preview process.
        input_table_specifier_id:
          type: string
          title: Input Table Specifier Id
          description: The table specifier of where the source data for predictions is.
        target_table_specifier_id:
          type: string
          title: Target Table Specifier Id
          description: The table specifier of where we'll be placing predictions.
      additionalProperties: true
      type: object
      required:
      - dataset_id
      - input_table_specifier_id
      - target_table_specifier_id
      title: PreviewPredictResponse
    Table:
      properties:
        name:
          type: string
          title: Name
          description: Name of the table.
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Schema
          description: Schema of the table. Only provided for sources that have some concept of a 'wrapper' schema.
        columns:
          items:
            $ref: '#/components/schemas/Column'
          type: array
          title: Columns
          description: List of columns in the table.
      additionalProperties: true
      type: object
      required:
      - name
      - columns
      title: Table
    CommitPredictPayload:
      properties:
        flow_id:
          type: string
          title: Flow Id
          description: Flow ID these predictions will be run off of. Important to specify because this is how we track down the exact model we'll use for predictions.
        connection_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Connection Id
          description: Connection ID to use for credentials. If not provided, we use the connection attached to the flow (older meltano deployments)] = None.
        specifier:
          additionalProperties:
            type: string
          type: object
          title: Specifier
          description: The specifier specifying the table where we'll be importing data from. For now, we derive the output table name from this table rather than allowing user-specified output table names.
        mappings:
          additionalProperties:
            type: string
          type: object
          title: Mappings
          description: Field mappings, useful incase you are trying to run on a table with the same information but different column names. Keys of the object are keys on the table we'll be running predictions on, Values of the object are keys on our training table.
          default: {}
        blocking:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Blocking
          description: Whether or not to block until full job is done. For backwards compatbility with old UI
          default: false
        step_title:
          anyOf:
          - type: string
          - type: 'null'
          title: Step Title
          description: Which deployment user-friendly name (Snowflake, Postgres, etc) is running
        step_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Step Key
          description: Which deployment key (postgre-sql-output, etc) is running
      additionalProperties: true
      type: object
      required:
      - flow_id
      - specifier
      title: CommitPredictPayload
    ConnectionPayload:
      properties:
        _owner:
          type: string
          title: ' Owner'
          description: ID of user that created this entry.
        _org:
          type: string
          title: ' Org'
          description: ID of user's active organization when creating this entry.
        validated:
          type: boolean
          title: Validated
          description: Whether we've tested and validated these credentials actually work. Relevant due to us persisting credentials *before* we attempt imports (rather than how we used to do it, after) to help with bug triage, particularly when errors occur during the initial `/commit/import` call and not during the followup task doing the actual import.
          default: true
        config:
          type: object
          title: Config
          description: JSON object specifying config on the connection. This is a value whose format WE specify; it needs to have enough information that we can map it to either a Meltano extractor or loader, but is fully distinct from either of those concepts. Avoiding coupling both this and table specifiers to whether they are pulling data in or sending data out is very useful and gives us very powerful generalization capabilities.
      additionalProperties: true
      type: object
      required:
      - _owner
      - _org
      - config
      title: ConnectionPayload
    PreviewPredictPayload:
      properties:
        flow_id:
          type: string
          title: Flow Id
          description: Flow ID these predictions will be run off of. Important to specify because this is how we track down the exact model we'll use for predictions.
        connection_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Connection Id
          description: Connection ID to use for credentials. If not provided, we use the connection attached to the flow (older meltano deployments)] = None.
        specifier:
          additionalProperties:
            type: string
          type: object
          title: Specifier
          description: The table specifier specifying the table we'd like a preview of. We pull it down and run N predictions on it, then return the results.
        mappings:
          additionalProperties:
            type: string
          type: object
          title: Mappings
          description: Field mappings, useful incase you are trying to run on a table with the same information but different column names. Keys of the object are keys on the table we'll be running predictions on, Values of the object are keys on our training table.
          default: {}
        step_title:
          anyOf:
          - type: string
          - type: 'null'
          title: Step Title
          description: Which deployment user-friendly name (Snowflake, Postgres, etc) is running
        step_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Step Key
          description: Which deployment key (postgre-sql-output, etc) is running
      additionalProperties: true
      type: object
      required:
      - flow_id
      - specifier
      title: PreviewPredictPayload
    CommitImportPayload:
      properties:
        flow_id:
          type: string
          title: Flow Id
          description: Flow ID that the import schedule should be tied to. Necessary in order to create a Flow -> Connection ID mapping so we can look up the set of credentials attached to a flow, which is useful for deployments.
        connection:
          anyOf:
          - type: string
          - $ref: '#/components/schemas/OAuthConnectionPayload'
          - $ref: '#/components/schemas/ConnectionPayload'
          title: Connection
          description: An existing connection ID or the payload of the connection to create.
        specifier:
          additionalProperties:
            type: string
          type: object
          title: Specifier
          description: The specifier used to track down the table. We expect a specifier rather than a full table specifier because we use this in a context where we are not working with an existing connection.
        table_config:
          anyOf:
          - type: object
          - type: 'null'
          title: Table Config
          description: Any additional config used for the import, not on the general connection
        dataset_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Dataset Name
          description: Name of the dataset to create. If not provided, we'll create a dataset with a name derived from the table specifer.
      additionalProperties: true
      type: object
      required:
      - flow_id
      - connection
      - specifier
      title: CommitImportPayload
    IntrospectConnectionPayload:
      properties:
        connection:
          $ref: '#/components/schemas/ConnectionPayload'
          description: Payload of the Connection object we'd like to introspect.
      additionalProperties: true
      type: object
      required:
      - connection
      title: IntrospectConnectionPayload
    IntrospectPropertiesPayload:
      properties:
        connection_id:
          type: string
          title: Connection Id
          description: ID of the connection to introspect
      additionalProperties: true
      type: object
      required:
      - connection_id
      title: IntrospectPropertiesPayload
    IntrospectTablePayload:
      properties:
        flow_id:
          type: string
          title: Flow Id
          description: Flow ID that this is in context of. Necessary to track down the connection we should use for credentials.
        connection_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Connection Id
          description: Connection to use for introspection. If not provided, use the connection attached to the flow (older meltano deployments)] = None.
        table_config:
          anyOf:
          - type: object
          - type: 'null'
          title: Table Config
          description: Any additional config used for the introspection, not on the general connection
        specifier:
          additionalProperties:
            type: string
          type: object
          title: Specifier
          description: The specifier used to track down the table. We expect a specifier rather than a full table specifier because we use this in a context where we are not working with an existing connection
      additionalProperties: true
      type: object
      required:
      - flow_id
      - specifier
      title: IntrospectTablePayload
    OAuthConnectionPayload:
      properties:
        _owner:
          type: string
          title: ' Owner'
          description: ID of user that created this entry.
        _org:
          type: string
          title: ' Org'
          description: ID of user's active organization when creating this entry.
        validated:
          type: boolean
          title: Validated
          description: Whether we've tested and validated these credentials actually work. Relevant due to us persisting credentials *before* we attempt imports (rather than how we used to do it, after) to help with bug triage, particularly when errors occur during the initial `/commit/import` call and not during the followup task doing the actual import.
          default: true
        config:
          type: object
          title: Config
          description: JSON object specifying config on the connection. This is a value whose format WE specify; it needs to have enough information that we can map it to either a Meltano extractor or loader, but is fully distinct from either of those concepts. Avoiding coupling both this and table specifiers to whether they are pulling data in or sending data out is very useful and gives us very powerful generalization capabilities.
        oauth_connection_id:
          type: string
          title: Oauth Connection Id
          description: The pre-existing oauth connection to use
      additionalProperties: true
      type: object
      required:
      - _owner
      - _org
      - config
      - oauth_connection_id
      title: OAuthConnectionPayload
    Column:
      properties:
        name:
          type: string
          title: Name
          description: Name of the column.
      additionalProperties: true
      type: object
      required:
      - name
      title: Column
