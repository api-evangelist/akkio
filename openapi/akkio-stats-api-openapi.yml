    InsightsPayload:
      properties:
        audience_id:
          type: string
          title: Audience Id
          description: Audience ID to generate insights for
        insight_context:
          $ref: '#/components/schemas/InsightContext'
          description: Insight context to generate
        filters:
          additionalProperties:
            type: string
          type: object
          title: Filters
          description: Filters to generate insights for
        timeframe:
          anyOf:
          - $ref: '#/components/schemas/src__stats__insights__model__Timeframe'
          - type: 'null'
          description: Timeframe to generate insights for
      additionalProperties: true
      type: object
      required:
      - audience_id
      - insight_context
      - filters
      title: InsightsPayload
