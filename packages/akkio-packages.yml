note: >-
  Akkio ships exactly two first-party client libraries, both published 2021-03-05
  and untouched since — over five years stale as of this pass. Both wrap only the
  legacy /v1 datasets+models surface; neither covers the current /api/v1
  projects, training or chat-explore routes that Akkio's own docs call "a
  better-designed v2". Akkio's documented answer is code generation rather than
  SDK maintenance: the Code Generation page tells developers to generate a client
  from https://api.akkio.com/api/v1/api.yaml with openapi-typescript-codegen.
  Versions and dates below were read from the registry metadata endpoints
  (pypi.org/pypi/akkio/json and registry.npmjs.org/akkio) on 2026-08-13. No
  first-party package was found on RubyGems, Packagist, crates.io, NuGet, Maven
  Central or pkg.go.dev.
