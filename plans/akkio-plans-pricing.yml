note: >-
  Akkio publishes NO priced plans. The pricing page (probed 2026-08-13, HTTP 200)
  advertises a single unpriced tier — "Enterprise AI Analytics Platform ...
  Custom pricing based on your unique needs" — behind a "Contact Sales" call to
  action, so plan_count is recorded as 0 per the enterprise-contact-only rule.
  Akkio repositioned in 2025 from the self-serve no-code ML tool it launched as
  to an enterprise platform sold to media agencies; the older self-serve tiers
  the FAQ still references (View / Basic / Professional, and organization-wide
  Build-On / Dedicated Infrastructure) no longer appear on the pricing page with
  prices attached. Those tier NAMES are still load-bearing for the API, because
  the FAQ documents which API capabilities each one unlocks — captured below as
  the entitlement matrix rather than as priced plans.
