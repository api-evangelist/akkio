usage_units:
  note: >-
    The FAQ defines the metering unit for prediction usage even though no price
    is attached to it.
  definitions:
  - unit: prediction
    definition: >-
      1 prediction = 1 row of data fed through a prediction model. Only deployed
      prediction models count; creating a model does not count toward predictions.
  - unit: dataset size
    definition: >-
      1 million rows of connected data without data add-on packages; no file-size
      limit, but a technical limit of roughly 5 GB.
